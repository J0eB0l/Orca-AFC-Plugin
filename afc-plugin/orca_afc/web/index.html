<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AFC Lanes</title>
  <!-- The plugin puts afc.css and afc.js in place of these two tags; a browser
       opening this file loads them, and afc-mock.js stands in for OrcaSlicer
       when the address ends in ?mock=1. -->
  <link rel="stylesheet" href="afc.css">
</head>
<body>
  <div id="app" class="app">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div>Reading AFC from the printer…</div>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="afc-mock.js"></script>
  <script src="afc.js"></script>
</body>
</html>
